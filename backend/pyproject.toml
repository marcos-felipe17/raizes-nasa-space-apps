[project]
name = "raizes-api"
version = "0.1.0"
description = "API de apoio à decisão do Raízes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# O TestClient do FastAPI, usado nos testes, depende do httpx.
dev = [
  "httpx>=0.27,<1",
]
